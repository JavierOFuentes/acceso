<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12263f">
<link rel="manifest" href="manifest.json">
<title>Control de acceso vehicular</title>
<style>
  :root{--ok:#0e8a3e;--no:#c0261c;--warn:#b26a00;--bg:#12263f}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Arial,sans-serif;background:#eef1f5;color:#111}
  header{background:var(--bg);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
  header b{font-size:15px}
  #estado{font-size:11px;opacity:.85}
  main{padding:12px;max-width:560px;margin:0 auto}
  #lector{width:100%;border-radius:10px;overflow:hidden;background:#000}
  .panel{margin-top:12px;border-radius:12px;padding:16px;color:#fff;display:none}
  .panel.on{display:block}
  .verde{background:var(--ok)} .roja{background:var(--no)} .amarilla{background:var(--warn)}
  .azul{background:var(--bg)}
  .veredicto{font-size:26px;font-weight:800;letter-spacing:.5px}
  .patente{font-size:40px;font-weight:800;margin:6px 0;letter-spacing:2px}
  .patente:empty{margin:0}
  .dato{font-size:15px;line-height:1.45}
  .aviso{margin-top:10px;font-size:13px;background:rgba(255,255,255,.18);padding:8px 10px;border-radius:8px}
  .aviso:empty{display:none}
  .hor{margin-top:5px;font-size:14px;line-height:1.35;opacity:.92}
  .hor:empty{display:none}

  /* franja de aviso: la persona tiene que pasar por Gerencia */
  .ger{margin-top:11px;background:#ffd27a;color:#3d2a00;border-radius:9px;padding:10px 12px}
  .ger .t{font-size:17px;font-weight:800;letter-spacing:.4px;line-height:1.2}
  .ger .m{font-size:15px;margin-top:3px;line-height:1.3}
  .ger .h{font-size:13px;margin-top:4px;font-weight:700}
  .ger .p{font-size:12px;margin-top:4px;opacity:.8;line-height:1.3}

  /* selector de patentes cuando la persona tiene más de un vehículo */
  #lista{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  #lista:empty{display:none}
  .veh{width:100%;text-align:left;background:#fff;color:#12263f;border:0;border-radius:10px;
       padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
  .veh:focus-visible{outline:3px solid #ffd27a;outline-offset:2px}
  .veh .vp{font-size:27px;font-weight:800;letter-spacing:1.5px;line-height:1.1}
  .veh .vm{font-size:13px;color:#5a6b80}
  .veh.mal{background:#f2d7d5}
  .veh.mal .vp{color:#8d1a13;text-decoration:line-through}
  .veh.mal .vm{color:#8d1a13;font-weight:700}

  .fila{display:flex;gap:8px;margin-top:12px}
  input,button{font-size:16px;padding:11px;border-radius:9px;border:1px solid #c3cbd6}
  input{flex:1;min-width:0}
  button{background:var(--bg);color:#fff;border:0;font-weight:600}
  button.sec{background:#5a6b80}
  .volver{margin-top:10px;background:rgba(255,255,255,.22);color:#fff;font-size:13px;padding:8px 12px;border-radius:8px}
  .pie{margin-top:14px;font-size:12px;color:#5a6b80;text-align:center;line-height:1.6}
</style>
</head>
<body>
<header>
  <b>Acceso vehicular</b>
  <span id="estado">iniciando…</span>
</header>

<main>
  <div id="lector"></div>

  <div id="panel" class="panel">
    <div class="veredicto" id="veredicto"></div>
    <div class="patente" id="patente"></div>
    <div class="dato" id="detalle"></div>
    <div id="lista"></div>
    <div class="aviso" id="aviso"></div>
  </div>

  <div class="fila">
    <input id="manual" placeholder="Código o patente (si el QR no lee)" autocomplete="off">
    <button onclick="buscarManual()">Buscar</button>
  </div>
  <div class="fila">
    <button class="sec" style="flex:1" onclick="sincronizar(true)">Actualizar base</button>
    <button class="sec" style="flex:1" onclick="reiniciar()">Nuevo escaneo</button>
  </div>

  <div class="pie">
    Verificá SIEMPRE que la patente en pantalla coincida con la del vehículo.<br>
    <span id="infoBase"></span>
  </div>
</main>

<script src="html5-qrcode.min.js"></script>
<script>
/* ================= CONFIGURACIÓN ================= */
const API   = 'https://script.google.com/macros/s/AKfycbzSKdPxCIYiav8M0K6tr3ZpESzqMUtxlKu0msj6eY0ii26CKXLKBvFiYlZm477BSP8-3A/exec';   // termina en /exec
const CLAVE = 'jfkdidhdkfdkso85l5lg95l';            // igual que en Codigo.gs
const PREFIJO = 'PK:';
const PUESTO  = 'Portón principal';                 // identifica al puesto en el registro

/* Avisos de Gerencia.
   La persona con AVISO cargado entra igual la primera vez y el guardia le
   avisa. El plazo NO se cuenta en días sino en ventanas de atención: Gerencia
   atiende días hábiles de GER_DESDE a GER_HASTA. Se bloquea recién cuando dejó
   pasar VENTANAS_PLAZO ventana(s) enteras posteriores al aviso, así que nadie
   queda bloqueado por un horario que no le daba.
   Ej.: aviso el viernes a las 22 -> su ventana es el lunes de 8 a 12; entra
   sábado, domingo y el lunes hasta las 12. Aviso el lunes a las 10 (con la
   ventana del lunes ya empezada) -> su ventana es el martes de 8 a 12. */
const GER_DESDE = 8;        // hora en que abre Gerencia
const GER_HASTA = 12;       // hora en que cierra
const VENTANAS_PLAZO = 1;   // ventanas completas que se le dan
/* Días en que Gerencia no atiende. Cuentan igual que un sábado o un domingo:
   el plazo de un aviso los saltea.
   La lista de verdad es la hoja FERIADOS de la planilla y baja con la base
   (BASE.f), así que se corrige desde ahí sin tocar este archivo. Esto de acá
   abajo es sólo la red por si un teléfono todavía no sincronizó. */
const FERIADOS = ['2026-01-01','2026-02-16','2026-02-17','2026-03-23','2026-03-24',
                  '2026-04-02','2026-04-03','2026-05-01','2026-05-25','2026-06-15',
                  '2026-06-20','2026-07-09','2026-07-20','2026-08-17','2026-10-12',
                  '2026-11-23','2026-12-07','2026-12-08','2026-12-25'];
/* ================================================= */

let BASE = null, lector = null, ultimo = 0, ACTUAL = null;

/* ---------- base local (funciona sin señal) ---------- */
function cargarLocal(){
  try{ BASE = JSON.parse(localStorage.getItem('base')||'null'); }catch(e){ BASE=null; }
  // La base guardada por la versión anterior tenía otra estructura (BASE.r).
  // Si es de esas, se descarta para que nadie opere con datos mal leídos.
  if(BASE && !BASE.p){ BASE=null; localStorage.removeItem('base'); }
  pintarEstado();
}
function pintarEstado(){
  const est = document.getElementById('estado');
  if(!BASE){ est.textContent='sin base — actualizá'; est.style.color='#ffb4ae'; return; }
  const f = new Date(BASE.version);
  est.textContent = 'base al '+f.toLocaleDateString('es-AR')+' '+f.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  est.style.color = (Date.now()-f.getTime() > 7*864e5) ? '#ffd27a' : '#bfe8cd';
  document.getElementById('infoBase').textContent =
    BASE.personas+' personas · '+BASE.total+' vehículos en la base.';
}
async function sincronizar(avisar){
  try{
    const r = await fetch(API+'?action=data&k='+encodeURIComponent(CLAVE), {redirect:'follow'});
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    if(!d.p) throw new Error('respuesta_vieja');
    BASE = d;
    localStorage.setItem('base', JSON.stringify(d));
    pintarEstado();
    enviarPendientes();
    if(avisar) alert('Base actualizada: '+d.personas+' personas, '+d.total+' vehículos.');
  }catch(e){
    if(avisar) alert('No se pudo actualizar (sin conexión o backend desactualizado). '+
                     'Se sigue usando la última base descargada.');
  }
}

/* ---------- resolución del código ---------- */
function limpiar(t){
  t = String(t||'').trim().toUpperCase();
  if(t.indexOf(PREFIJO.toUpperCase())===0) t = t.substr(PREFIJO.length);
  return t;
}
function soloAlfaNum(t){ return String(t||'').replace(/[^A-Z0-9]/g,''); }

/** Devuelve {cod, per, sel} donde sel es el índice del vehículo a preseleccionar (-1 = ninguno). */
function resolver(texto){
  const t = limpiar(texto);
  if(!t) return null;

  if(BASE.p[t]) return {cod:t, per:BASE.p[t], sel:-1};          // código de persona

  const a = BASE.x[t];                                          // QR viejo de vehículo
  if(a && BASE.p[a.c]) return {cod:a.c, per:BASE.p[a.c], sel:a.i, viejo:t};

  const pat = soloAlfaNum(t);                                   // búsqueda por patente
  if(pat.length>=5){
    for(const c in BASE.p){
      const autos = BASE.p[c].a;
      for(var i=0;i<autos.length;i++){
        if(soloAlfaNum(autos[i].p)===pat) return {cod:c, per:BASE.p[c], sel:i};
      }
    }
  }
  return null;
}

/* ---------- ventanas de atención de Gerencia ---------- */
function dosD(n){ return (n<10?'0':'')+n; }
function isoDe(d){ return d.getFullYear()+'-'+dosD(d.getMonth()+1)+'-'+dosD(d.getDate()); }
function selloDe(d){ return isoDe(d)+'T'+dosD(d.getHours())+':'+dosD(d.getMinutes()); }
function feriados(){
  return (BASE && BASE.f && BASE.f.length) ? BASE.f : FERIADOS;
}
function esHabil(d){
  const s = d.getDay();
  if(s===0 || s===6) return false;               // fin de semana
  return feriados().indexOf(isoDe(d))===-1;      // feriado o asueto
}
/** 'aaaa-mm-dd' o 'aaaa-mm-ddThh:mm' -> Date. Sin hora se asume el final del
    día: ante la duda no se le descuenta una ventana que quizás no tuvo. */
function parseSello(t){
  const m = String(t||'').match(/^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2}))?/);
  if(!m) return null;
  const conHora = m[4]!==undefined;
  return new Date(+m[1], +m[2]-1, +m[3], conHora?+m[4]:23, conHora?+m[5]:59, 0, 0);
}
/** Fin de la ventana de atención con la que se le vence el plazo. */
function vencePlazo(aviso){
  var dia = new Date(aviso.getFullYear(), aviso.getMonth(), aviso.getDate(), 0,0,0,0);
  var n = 0, tope = 0, fin = null;
  while(n < VENTANAS_PLAZO && tope < 120){
    const abre   = new Date(dia.getFullYear(), dia.getMonth(), dia.getDate(), GER_DESDE, 0, 0, 0);
    const cierra = new Date(dia.getFullYear(), dia.getMonth(), dia.getDate(), GER_HASTA, 0, 0, 0);
    // sólo cuenta la ventana que empieza después del aviso: si el aviso lo
    // recibió a las 10, la de ese día ya estaba empezada y no se le computa.
    if(esHabil(dia) && abre >= aviso){ n++; fin = cierra; }
    if(n >= VENTANAS_PLAZO) break;
    dia.setDate(dia.getDate()+1); tope++;
  }
  return fin;
}
function gerenciaAbierta(){
  const h = new Date();
  return esHabil(h) && h.getHours() >= GER_DESDE && h.getHours() < GER_HASTA;
}
function fmtFecha(iso){
  const d = parseSello(iso);
  return d ? dosD(d.getDate())+'/'+dosD(d.getMonth()+1) : (iso||'');
}
function fmtHora(iso){
  const t = String(iso||'').match(/T(\d{1,2}):(\d{2})/);
  return t ? ' a las '+t[1]+':'+t[2] : '';
}
function fmtMomento(d){
  const n = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const hoy = new Date();
  const mismo = d.toDateString()===hoy.toDateString();
  return (mismo ? 'hoy' : n[d.getDay()]+' '+dosD(d.getDate())+'/'+dosD(d.getMonth()+1))+
         ' a las '+d.getHours()+' hs';
}
/** {hay, txt, ad, fin, vencido}. Se calcula en el teléfono y no en el backend
    porque la base queda cacheada: si no, el bloqueo llegaría tarde. */
function verAviso(per){
  if(!per || !per.av) return {hay:false};
  const o = {hay:true, txt:per.av, ad:per.ad||'', fin:null, vencido:false};
  if(!o.ad) return o;                       // todavía no se le avisó
  const aviso = parseSello(o.ad);
  if(!aviso) return o;
  o.fin = vencePlazo(aviso);
  if(o.fin) o.vencido = new Date() > o.fin;
  return o;
}
function bloqueAviso(a){
  if(!a.hay) return '';
  var pie;
  if(!a.ad)          pie = 'Primer aviso. Dejalo pasar y decile que vaya.';
  else if(a.vencido) pie = 'Avisado el '+fmtFecha(a.ad)+fmtHora(a.ad)+'. Tenía tiempo hasta el '+
                           fmtMomento(a.fin)+' y no se presentó.';
  else if(a.fin)     pie = 'Avisado el '+fmtFecha(a.ad)+fmtHora(a.ad)+'. Tiene tiempo hasta '+
                           fmtMomento(a.fin)+'.'+(gerenciaAbierta()?' Ahora está abierta.':'');
  else               pie = 'Avisado el '+fmtFecha(a.ad)+fmtHora(a.ad)+'.';
  return '<div class="ger"><div class="t">PRESENTARSE EN GERENCIA</div>'+
         '<div class="m">'+a.txt+'</div>'+
         '<div class="h">Atiende días hábiles de '+GER_DESDE+' a '+GER_HASTA+' hs</div>'+
         '<div class="p">'+pie+'</div></div>';
}
function guardarBase(){
  try{ localStorage.setItem('base', JSON.stringify(BASE)); }catch(e){}
}

/* ---------- evaluación de un vehículo ---------- */
function evaluar(v){
  if(v.e==='BAJA' || v.e==='SUSPENDIDO')
    return {ok:false, ver:'NO AUTORIZADO', msg:'Estado del vehículo: '+v.e};
  return {ok:true, ver:'AUTORIZADO', msg:'Comparar la patente con el vehículo.'};
}
function horario(per){
  return per.h ? '<div class="hor">'+per.h+'</div>' : '';
}

/* ---------- flujo principal ---------- */
function verificar(texto){
  if(!BASE){ pintar('roja','SIN BASE','','','Actualizá la base con señal antes de operar.'); return; }

  const r = resolver(texto);
  if(!r){
    ACTUAL = null;
    pintar('roja','NO AUTORIZADO','—','','Código o patente no figura en la base.');
    log(limpiar(texto),'','','NO AUTORIZADO');
    return;
  }
  ACTUAL = r;

  if(r.per.e==='BAJA' || r.per.e==='SUSPENDIDO'){
    pintar('roja','NO AUTORIZADO','', r.per.n, 'Persona dada de baja ('+r.per.e+'). Ningún vehículo habilitado.');
    log(r.cod,'',r.per.n,'NO AUTORIZADO (PERSONA '+r.per.e+')');
    return;
  }
  const av = verAviso(r.per);
  if(av.vencido){
    pintar('roja','NO AUTORIZADO','', r.per.n+horario(r.per)+bloqueAviso(av),
           'Se le avisó y no se presentó. No ingresa hasta que Gerencia lo resuelva.');
    log(r.cod,'',r.per.n,'NO AUTORIZADO (AVISO VENCIDO)');
    return;
  }
  if(!r.per.a.length){
    pintar('amarilla','SIN VEHÍCULO','', r.per.n+horario(r.per)+bloqueAviso(av),
           'La persona no tiene vehículos cargados en la base.');
    log(r.cod,'',r.per.n,'SIN VEHICULO');
    return;
  }
  if(r.per.a.length===1){ elegir(0); return; }   // un solo auto: directo
  if(r.sel>=0){ elegir(r.sel); return; }         // vino por patente o QR viejo
  listar();
}

/** Persona con varios vehículos: el guardia toca la patente que está entrando. */
function listar(){
  const per = ACTUAL.per;
  var h = '';
  per.a.forEach(function(v,i){
    const ev = evaluar(v);
    h += '<button class="veh'+(ev.ok?'':' mal')+'" onclick="elegir('+i+')">'+
           '<span class="vp">'+v.p+'</span>'+
           '<span class="vm">'+[v.m, ev.ok?'':ev.ver].filter(Boolean).join(' · ')+'</span>'+
         '</button>';
  });
  pintar('azul','ELEGIR PATENTE','',
         per.n+horario(per)+'<div class="hor">'+per.a.length+' vehículos en la base</div>'+bloqueAviso(verAviso(per)),
         'Tocá la patente del vehículo que está entrando. Se registra la que elijas.');
  document.getElementById('lista').innerHTML = h;
}

/** Decisión final sobre un vehículo concreto. Es lo único que se registra. */
function elegir(i){
  const per = ACTUAL.per, v = per.a[i], ev = evaluar(v);

  // El aviso se cuenta como entregado cuando la persona efectivamente entra.
  // Se marca también acá, en el teléfono, para que el plazo corra aunque el
  // equipo no vuelva a sincronizar. El backend nunca pisa una fecha ya puesta.
  var marcar = '';
  if(per.av && !per.ad && ev.ok){
    per.ad = selloDe(new Date());
    guardarBase();
    marcar = ACTUAL.cod;
  }
  const a = verAviso(per);

  const detalle = per.n + (v.m||v.s ? '<br>'+[v.m,v.s].filter(Boolean).join(' · ') : '')
                + horario(per) + bloqueAviso(a);
  var aviso = a.hay && ev.ok ? 'Avisale que pase por Gerencia. '+ev.msg : ev.msg;
  if(per.a.length>1){
    aviso += '<br><button class="volver" onclick="listar()">Ver las otras patentes</button>';
  }
  pintar(ev.ok?'verde':'roja', ev.ver, v.p, detalle, aviso);
  log(ACTUAL.cod, v.p, per.n, ev.ver + (marcar ? ' (AVISO ENTREGADO)' : ''), marcar);
}

function pintar(clase,ver,pat,det,aviso){
  const p = document.getElementById('panel');
  p.className = 'panel on '+clase;
  document.getElementById('veredicto').textContent = ver;
  document.getElementById('patente').textContent   = pat||'';
  document.getElementById('detalle').innerHTML     = det||'';
  document.getElementById('lista').innerHTML       = '';
  document.getElementById('aviso').innerHTML       = aviso||'';
  if(navigator.vibrate) navigator.vibrate(clase==='verde'?120:(clase==='azul'?60:[90,70,90]));
  window.scrollTo(0,0);
}

/* ---------- auditoría (se acumula sin señal y se envía al sincronizar) ---------- */
function log(c,p,n,r,av){
  const q = JSON.parse(localStorage.getItem('pend')||'[]');
  const ev = {t:Date.now(), c:c, p:p, n:n, r:r, g:PUESTO};
  if(av) ev.av = av;      // pedido de sellar AVISADO en la hoja PERSONAS
  q.push(ev);
  localStorage.setItem('pend', JSON.stringify(q.slice(-500)));
  enviarPendientes();
}
function enviarPendientes(){
  const q = JSON.parse(localStorage.getItem('pend')||'[]');
  if(!q.length || !navigator.onLine) return;
  fetch(API, {method:'POST', body: JSON.stringify({k:CLAVE, eventos:q})})
    .then(function(){ localStorage.setItem('pend','[]'); })
    .catch(function(){});
}

/* ---------- cámara ---------- */
function iniciarLector(){
  lector = new Html5Qrcode('lector');
  lector.start({facingMode:'environment'}, {fps:10, qrbox:{width:240,height:240}},
    function(txt){
      const ahora = Date.now();
      if(ahora - ultimo < 2500) return;   // evita relecturas del mismo QR
      ultimo = ahora;
      verificar(txt);
    }, function(){}
  ).catch(function(){
    document.getElementById('lector').innerHTML =
      '<div style="color:#fff;padding:18px;font-size:14px">No se pudo abrir la cámara. '+
      'Permitir el acceso en el navegador y recargar, o usar la búsqueda manual.</div>';
  });
}
function reiniciar(){
  document.getElementById('panel').className='panel';
  document.getElementById('lista').innerHTML='';
  document.getElementById('manual').value='';
  ACTUAL = null;
  ultimo = 0;
}
function buscarManual(){ verificar(document.getElementById('manual').value); }
document.getElementById('manual').addEventListener('keydown', function(e){ if(e.key==='Enter') buscarManual(); });

cargarLocal();
sincronizar(false);
iniciarLector();
window.addEventListener('online', function(){ sincronizar(false); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
